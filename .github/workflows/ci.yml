name: Go CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '**'

jobs:

  strongo_workflow:
    permissions:
      contents: write
    # Pinned to an exact tag, not the moving @v1 tag: @v1 has been retired
    # because it drifted patch releases behind while still accepting inputs
    # it did not implement, so a configured input could silently no-op.
    uses: strongo/cicd/.github/workflows/workflow.yml@v1.14.17

    secrets:
      gh_token: ${{ secrets.GITHUB_TOKEN }}

    with:
      disable-version-bumping: true
      go_version: '1.27.0'
      # No min_test_coverage_percent: this repo has no go.mod anywhere, so
      # `go mod download all` fails before anything can build or be tested.
      # See PR description for the finding.
